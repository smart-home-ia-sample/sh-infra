# Smart Home AI — full stack.
#
# Default: published images from GitHub Packages (ghcr.io). Just:
#   docker compose up -d              # GHCR_OWNER defaults to smart-home-ia-sample
#
# Build from your sibling checkouts instead (see README + ./bootstrap.sh):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d
# Fully offline (also builds sh-common + the SPA from siblings):
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.local.yml up --build -d
#
# Services are split by layer under compose/:
#   infra.yml   ollama, mosquitto
#   core.yml    bff, bfa, home-mcp, device-sim
#   agents.yml  orchestrator + the security / environment / energy A2A workers

include:
  - compose/infra.yml
  - compose/core.yml
  - compose/agents.yml
