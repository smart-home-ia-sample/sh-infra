name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Validate the compose model parses and interpolates in all three modes.
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: base (published images)
        run: docker compose -f docker-compose.yml config -q
      - name: + build (from siblings)
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
      - name: + local (fully offline)
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.local.yml config -q
