# Override (on top of docker-compose.build.yml): fully offline — sh-common and the
# SPA are also built from sibling checkouts, nothing is fetched from GitHub.
# Needs sh-common/ and sh-frontend/ as siblings too (./bootstrap.sh clones them).
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.local.yml up --build -d

x-shcommon-local: &shcommon-local
  additional_contexts:
    sh_common: ../sh-common
  args:
    SH_COMMON_SOURCE: local

services:
  bff:
    build:
      additional_contexts:
        sh_frontend: ../sh-frontend
      args:
        FRONT_SOURCE: local
  bfa:
    build: *shcommon-local
  home-mcp:
    build: *shcommon-local
  orchestrator:
    build: *shcommon-local
  security:
    build: *shcommon-local
  environment:
    build: *shcommon-local
  energy:
    build: *shcommon-local
