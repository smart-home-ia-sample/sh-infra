# Override: build every sh-* service from its sibling checkout instead of pulling
# the published image. `image:` is inherited from the base files, so the build is
# tagged the same way. sh-common and the SPA are resolved from GitHub (each
# image's default build mode); for a fully-offline build add docker-compose.local.yml.
#
#   ./bootstrap.sh
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up --build -d

services:
  bff:
    build:
      context: ../sh-bff
  bfa:
    build:
      context: ../sh-bfa
  home-mcp:
    build:
      context: ../sh-mcp
  device-sim:
    build:
      context: ../sh-device-sim
  orchestrator:
    build:
      context: ../sh-orchestrator
  security:
    build:
      context: ../sh-agent-security
  environment:
    build:
      context: ../sh-agent-environment
  energy:
    build:
      context: ../sh-agent-energy
